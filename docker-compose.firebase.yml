# Enables real push notifications (Firebase Cloud Messaging) for the notification service.
#
#   1. Firebase console -> Project settings -> Service accounts -> "Generate new private key"
#   2. Save the file as ./secrets/firebase-service-account.json   (the secrets/ folder is git- and docker-ignored)
#   3. docker compose -f docker-compose.yml -f docker-compose.firebase.yml up -d --build
#
# Without this file the notification service only logs pushes (Firebase:Enabled=false).
services:
  notification:
    environment:
      Firebase__Enabled: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase.json:ro
