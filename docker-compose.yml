name: genkan

x-service-env: &service-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: genkan
      POSTGRES_USER: genkan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genkan -d genkan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:15672:15672"   # management UI, local only
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: Genkan.Auth/Genkan.Auth.Api/Genkan.Auth.Api.csproj
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Database=genkan;Username=genkan;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Seed__AdminEmail: ${ADMIN_EMAIL:?copy .env.example to .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?copy .env.example to .env}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: Genkan.Notification/Genkan.Notification.Api/Genkan.Notification.Api.csproj
    environment:
      <<: *service-env
      ConnectionStrings__Postgres: Host=postgres;Database=genkan;Username=genkan;Password=${POSTGRES_PASSWORD}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: Genkan.Gateway/Genkan.Gateway.csproj
    environment:
      <<: *service-env
      Services__AuthUrl: http://auth:8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"   # the only service exposed to clients
    depends_on:
      auth: { condition: service_healthy }
      notification: { condition: service_healthy }

volumes:
  pgdata:
  rabbitmq:
