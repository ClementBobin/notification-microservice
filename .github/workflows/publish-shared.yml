name: publish-shared
on:
  push:
    tags: ['shared-v*']          # git tag shared-v1.0.0 && git push --tags
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: |
          VERSION="${GITHUB_REF_NAME#shared-v}"
          dotnet pack src/Genkan.Shared/Genkan.Shared.csproj -c Release -p:Version=$VERSION -o out
          dotnet nuget push out/*.nupkg --skip-duplicate \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }}